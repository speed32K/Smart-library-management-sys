<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search result — Smart Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="result-page">
  <div class="result-box" id="box"><p class="result-head">Searching…</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
const q = new URLSearchParams(location.search).get('q') || '';

async function render() {
  let html = `<p class="result-head">Results for “${esc(q)}”</p>`;
  try {
    const books = await searchBooks(q);
    if (!books.length) {
      html += `<div class="card nofound">${ICON.nobook}
        <h2>No book found</h2><p>Try another name or serial number.</p></div>`;
    } else {
      html += books.map(b => `
        <div class="card book">
          <h2>${esc(b.name)}</h2>
          <p class="serial">Serial: ${esc(b.serial)}</p>
          <div class="tiles">
            <div class="tile"><span>Rack</span><b>${esc(b.rack)}</b></div>
            <div class="tile"><span>Deck</span><b>${esc(b.deck)}</b></div>
            <div class="tile"><span>Direction</span><b>${esc(b.direction)}</b></div>
          </div>
        </div>`).join('');
    }
  } catch (err) {
    html += `<div class="card nofound"><h2>Could not load</h2><p>Check your internet connection and try again.</p></div>`;
  }
  html += `<a class="btn outline full" href="index.html">${ICON.back} New search</a>`;
  document.getElementById('box').innerHTML = html;
}

render();
onBooksChanged(render); // updates live if the admin changes something
</script>
</body>
</html>
